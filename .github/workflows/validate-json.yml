
name: Build, Validate and Release JSON Catalogue

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Bundle Schema and Validate Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Create output directory
        run: mkdir -p dist

      - name: Bundle JSON schemas
        run: docker compose run --rm schema-bundler

      - name: Validate JSON data
        run: docker compose run --rm json-validator

      - name: Consolidate JSON data
        run: docker compose run --rm json-consolidator

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-json-catalogue
          path: |
            dist/schema.json
            dist/catalogue.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release if artifacts changed
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-json-catalogue
          path: dist

      - name: Check whether generated artifacts have changed
        id: artifact_changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          LAST_TAG="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"

          if [[ -z "$LAST_TAG" ]]; then
            echo "No previous release found; a release is required."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing against release: $LAST_TAG"

          gh release download "$LAST_TAG" \
            --dir "$TEMP_DIR" \
            --pattern "schema.json" \
            --pattern "catalogue.json"

          CHANGED=false

          for FILE in schema.json catalogue.json; do
            if [[ ! -f "$TEMP_DIR/$FILE" ]]; then
              echo "$FILE is missing from the previous release."
              CHANGED=true
              continue
            fi

            if [[ "$FILE" == "catalogue.json" ]]; then
              # Ignore the release-specific version property.
              jq 'del(.version)' "dist/$FILE" > "$TEMP_DIR/current.json"
              jq 'del(.version)' "$TEMP_DIR/$FILE" > "$TEMP_DIR/previous.json"

              if ! cmp -s "$TEMP_DIR/current.json" "$TEMP_DIR/previous.json"; then
                echo "$FILE has changed."
                CHANGED=true
              fi
            elif ! cmp -s "dist/$FILE" "$TEMP_DIR/$FILE"; then
              echo "$FILE has changed."
              CHANGED=true
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Generate CalVer version
        if: steps.artifact_changes.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          VERSION="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set catalogue version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          jq --arg version "$VERSION" \
            '.version = $version' \
            dist/catalogue.json > dist/catalogue.tmp.json

          mv dist/catalogue.tmp.json dist/catalogue.json

      - name: Configure Git identity
        if: steps.version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push Git tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          git fetch --force --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already exists on another commit."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/schema.json
            dist/catalogue.json
